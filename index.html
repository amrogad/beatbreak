<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14112b" />
    <meta name="description" content="Beatbreak turns your own audio files into playable four-lane rhythm charts in the browser. Analyze, trim, play, and export locally with no account or upload." />
    <meta name="color-scheme" content="dark" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self';" />
  <meta property="og:title" content="Beatbreak - Turn Your Songs Into Rhythm Charts" />
  <meta property="og:description" content="Load your own song, generate four difficulty charts, and play instantly. Runs entirely offline in your browser." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="./icons/icon-512.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Beatbreak - Turn Your Songs Into Rhythm Charts" />
  <meta name="twitter:description" content="Load your own song, generate four difficulty charts, and play instantly. Runs entirely offline in your browser." />
    <title>Beatbreak - Turn Your Songs Into Rhythm Charts</title>
    <script src="./theme.js"></script>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #14112b; color: #ffffff; }
      #root { min-height: 100%; }
      .boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background:
          radial-gradient(50vmax 40vmax at 8% -10%, rgba(179, 92, 255, 0.14), transparent 70%),
          radial-gradient(45vmax 40vmax at 100% 20%, rgba(61, 155, 255, 0.12), transparent 70%),
          #14112b;
        font-family: Barlow, 'Segoe UI', Arial, sans-serif;
      }
      .boot-box { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      .boot-mark {
        width: 64px; height: 64px; display: grid; place-items: center;
        background: #2a2260; border: 2px solid #5a4fb0;
      }
      .boot-mark svg { width: 42px; height: 42px; display: block; }
      .boot-title {
        font: 400 clamp(28px, 7vw, 44px)/1 Bungee, 'Segoe UI', Arial, sans-serif;
        letter-spacing: 0.04em; color: #ffd23d;
      }
      .boot-bar { width: 200px; height: 6px; background: #262056; overflow: hidden; }
      .boot-bar i {
        display: block; width: 40%; height: 100%;
        background: linear-gradient(90deg, #ff4f9a, #3d9bff, #3fe08a, #ffc93d);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      .boot-label { color: #b8b0e0; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; }
      [data-theme='mono'] body, [data-theme='mono'] .boot { background: #000000; }
      [data-theme='mono'] .boot-mark { background: #0d0d0d; border-color: #8a8a8a; }
      [data-theme='mono'] .boot-mark rect { fill: #ffffff; }
      [data-theme='mono'] .boot-title { color: #ffffff; }
      [data-theme='mono'] .boot-bar { background: #1a1a1a; }
      [data-theme='mono'] .boot-bar i { background: #ffffff; }
      [data-theme='mono'] .boot-label { color: #bdbdbd; }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot-bar i { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading Beatbreak">
        <div class="boot-box">
          <div class="boot-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <rect x="4" y="12" width="4" height="8" fill="#ff4f9a" />
              <rect x="10.5" y="7" width="4" height="18" fill="#3d9bff" />
              <rect x="17" y="9.5" width="4" height="13" fill="#3fe08a" />
              <rect x="23.5" y="13" width="4" height="6" fill="#ffc93d" />
            </svg>
          </div>
          <div class="boot-title">BEATBREAK</div>
          <div class="boot-bar"><i></i></div>
          <div class="boot-label">Loading</div>
        </div>
      </div>
    </div>
    <noscript>Beatbreak needs JavaScript and the Web Audio API to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
